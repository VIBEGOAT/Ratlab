<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VAST — Virtual Toxicology Workbench</title>
    <meta name="description" content="Explore simulated organ injury, dose-response, pharmacokinetic curves, and human-equivalent dose conversion. VAST is a virtual toxicology workbench for research and education using fictional compound profiles." />
  </head>
  <body>
    <div id="root">
      <div role="status" aria-label="Loading VAST" style="box-sizing:border-box;height:100dvh;padding:24px;display:grid;grid-template-rows:40px 1fr 32px;gap:24px">
        <div style="width:140px;border-radius:12px;background:light-dark(#e2e5e7,#252b2d)"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><div style="align-self:center;height:45%;border-radius:20px;background:light-dark(#e2e5e7,#252b2d)"></div><div style="border-radius:24px;background:light-dark(#e2e5e7,#252b2d)"></div></div>
        <div style="width:60%;border-radius:8px;background:light-dark(#e2e5e7,#252b2d)"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
